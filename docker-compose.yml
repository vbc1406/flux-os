services:
  flux-os:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Set the keys for the providers you want routed to; unset ones are skipped.
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - GOOGLE_API_KEY
      - GROQ_API_KEY
      - MISTRAL_API_KEY
      - DEEPSEEK_API_KEY
      - OPENROUTER_API_KEY
      # Clients must send this as their API key. Strongly recommended off-localhost.
      - FLUX_OS_API_KEY
      - FLUX_OS_ROUTE_ALL
      - FLUX_OS_DEFAULT_MODE
    restart: unless-stopped
