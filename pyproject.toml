[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "flux-os"
version = "0.1.0"
description = "Route every LLM request to the cheapest model that can handle it. OpenAI + Anthropic compatible proxy and Python library, for agents and wrappers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "vbc1406" }]
keywords = ["llm", "router", "llm-router", "openai", "anthropic", "claude", "gemini", "agents", "proxy", "model-routing", "ai-gateway"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.25",
  "fastapi>=0.100",
  "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23", "ruff>=0.5", "openai>=1.40", "anthropic>=0.40"]
frameworks = ["openai-agents>=0.2", "langchain-openai>=0.3", "langchain-anthropic>=0.3", "langgraph>=0.3"]

[project.scripts]
flux-os = "flux_os.cli:main"

[project.urls]
Homepage = "https://github.com/vbc1406/flux-os"
Issues = "https://github.com/vbc1406/flux-os/issues"

[tool.hatch.build.targets.wheel]
packages = ["flux_os"]

[tool.hatch.build.targets.sdist]
include = ["flux_os", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
